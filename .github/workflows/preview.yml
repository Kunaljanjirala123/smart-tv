name: Preview on an Android TV emulator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Glass Home"]
    types: [completed]

permissions:
  contents: write

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern glass-home.apk --dir apk
      - name: Run on Android TV 11 (API 30, like Fire OS 8)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/preview.sh
      - name: Publish screenshots to the "preview" pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview shots/* --prerelease --title "Emulator preview" \
            --notes "Screenshots from an Android TV 11 emulator, run ${{ github.run_id }}." --latest=false
