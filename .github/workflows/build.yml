name: Build Glass Home

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (official, from Google)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;34.0.0" >/dev/null
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: bash app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: glass-home-apk
          path: |
            app/build/glass-home.apk
            app/build/glass-home.apk.sha256
      # Only main becomes a release: that is the APK the Windows installer tells people to get.
      - name: Publish as the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" app/build/glass-home.apk app/build/glass-home.apk.sha256 \
            --title "Glass Home $tag" --notes "Built from ${{ github.sha }} by GitHub Actions." --latest

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: glass-home-apk
          path: apk
      - name: The previous release, to compare smoothness against
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern glass-home.apk --dir apk-old || true
      - name: Run on Android TV 11 (API 30, like Fire OS 8)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/preview.sh
      # main replaces "preview"; a pull request gets its own "preview-pr-N" pre-release, with the
      # APK it tested, so the change can be tried on a TV before it is merged.
      - name: Publish screenshots as a pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.number) || 'preview' }}
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" shots/* apk/glass-home.apk apk/glass-home.apk.sha256 --prerelease \
            --title "Emulator preview ($tag)" --target "${{ github.sha }}" --latest=false \
            --notes "Screenshots from an Android TV 11 emulator, run ${{ github.run_id }}, commit ${{ github.event.pull_request.head.sha || github.sha }}.
